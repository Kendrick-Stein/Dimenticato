<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizEngine Tests</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; background: #f5f7fa; color: #2c3e50; }
    h1 { border-bottom: 2px solid #3498db; padding-bottom: 0.5rem; }
    .pass { color: #2ecc71; } .fail { color: #e74c3c; } .known { color: #b8860b; }
    .test { margin: 0.5rem 0; padding: 0.5rem 1rem; border-left: 3px solid #ddd; background: #fff; }
    .test.pass { border-left-color: #2ecc71; } .test.fail { border-left-color: #e74c3c; }
    .test.known { border-left-color: #f0ad4e; }
    .summary { font-size: 1.2rem; font-weight: bold; margin: 1rem 0; }
    .note { color: #7f8c8d; font-size: 0.9rem; }
  </style>
</head>
<body>
<h1>QuizEngine Tests</h1>
<p class="note">覆盖 lib/utils.js（DimText 归一化）、lib/word-similarity.js（干扰项挑选）、
lib/quiz-engine.js（选项生成、判分、掌握度、难度偏好）。</p>
<div id="results"></div>

<script src="../lib/utils.js"></script>
<script src="../lib/word-similarity.js"></script>
<script src="../lib/quiz-engine.js"></script>
<script src="../lib/practice-flow.js"></script>
<script>
(function () {
  var results = document.getElementById('results');
  var passed = 0, failed = 0, known = 0;

  function row(cls, message) {
    var div = document.createElement('div');
    div.className = 'test ' + cls;
    div.textContent = message;
    results.appendChild(div);
  }

  function assert(condition, message) {
    if (condition) { passed++; row('pass', 'PASS: ' + message); }
    else { failed++; row('fail', 'FAIL: ' + message); }
  }

  function assertEqual(actual, expected, message) {
    var ok = actual === expected;
    if (ok) { passed++; row('pass', 'PASS: ' + message); }
    else {
      failed++;
      row('fail', 'FAIL: ' + message
        + ' (expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual) + ')');
    }
  }

  // 已确认、但归属其它工作流的缺陷：记录但不判红
  function knownIssue(condition, message, owner) {
    if (condition) { passed++; row('pass', 'PASS (was known issue): ' + message); }
    else { known++; row('known', 'KNOWN ISSUE [' + owner + ']: ' + message); }
  }

  // 一个分组抛错不该吞掉后面的测试和汇总行
  function group(name, fn) {
    try {
      fn();
    } catch (e) {
      failed++;
      row('fail', 'FAIL: ' + name + ' 抛错 — ' + (e && e.message ? e.message : e));
    }
  }

  function makeEngine(extra) {
    var config = {
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: null },
      stats: {},
      mastered: new Set(),
      fieldMap: { source: 'italian', target: 'english' },
      onUpdateStats: function () {},
      dom: {}
    };
    for (var k in (extra || {})) config[k] = extra[k];
    return new QuizEngine(config);
  }

  var engine = makeEngine();

  // ===== utils: shuffleArray =====
  group('shuffleArray', function () {
    var input = [1, 2, 3, 4, 5];
    var shuffled = engine.shuffleArray(input);
    assert(Array.isArray(shuffled), 'shuffleArray returns an array');
    assertEqual(shuffled.length, 5, 'shuffleArray preserves length');
    assertEqual(shuffled.sort().join(','), '1,2,3,4,5', 'shuffleArray preserves all elements');
  });

  // ===== quiz-engine: generateOptions 基本性质 =====
  group('generateOptions', function () {
    engine.config.state.currentWord = { italian: 'ciao', english: 'hello' };
    var wordPool = [
      { italian: 'ciao', english: 'hello' },
      { italian: 'grazie', english: 'thank you' },
      { italian: 'prego', english: "you're welcome" },
      { italian: 'buongiorno', english: 'good morning' },
      { italian: 'arrivederci', english: 'goodbye' }
    ];
    var options = engine.generateOptions('hello', wordPool);
    assertEqual(options.length, 4, 'generateOptions returns 4 options');
    assert(options.indexOf('hello') !== -1, 'options include correct answer');

    var unique = [];
    options.forEach(function (o) { if (unique.indexOf(o) === -1) unique.push(o); });
    assertEqual(unique.length, options.length, 'options have no duplicates');

    engine.config.state.currentWord = { italian: 'ciao', english: 'hello' };
    var smallPool = [
      { italian: 'ciao', english: 'hello' },
      { italian: 'grazie', english: 'thank you' },
      { italian: 'buongiorno', english: 'good morning' }
    ];
    var options2 = engine.generateOptions('hello', smallPool);
    var helloCount = options2.filter(function (o) { return o === 'hello'; }).length;
    assertEqual(helloCount, 1, 'correct answer appears exactly once in options');
  });

  // ===== utils: 重音策略 =====
  // 抹重音只用于"宽松比较"；去重 / 索引必须保留重音，否则 ou 和 où 会被合并掉
  group('DimText 重音策略', function () {
    assert(typeof DimText === 'object', 'DimText 已暴露到 window');
    assertEqual(engine.normalizeString('caffè'), engine.normalizeString('caffe'), 'normalizeString strips accents (caffè vs caffe)');
    assertEqual(engine.normalizeString('  CIAO  '), 'ciao', 'normalizeString trims and lowercases');
    assertEqual(engine.normalizeString('È'), 'e', 'normalizeString handles capital accented letters');

    assert(DimText.headwordKey('ou') !== DimText.headwordKey('où'), 'headwordKey 保留重音：ou ≠ où');
    assert(DimText.headwordKey('la') !== DimText.headwordKey('là'), 'headwordKey 保留重音：la ≠ là');
    assert(DimText.headwordKey('diner') !== DimText.headwordKey('dîner'), 'headwordKey 保留重音：diner ≠ dîner');
    assertEqual(DimText.looseKey('ou'), DimText.looseKey('où'), 'looseKey 抹掉重音：ou == où');
    assertEqual(DimText.headwordKey('Internet'), DimText.headwordKey('internet'), 'headwordKey 仍然忽略大小写');
    assert(DimText.sameHeadword('sœur', 'soeur'), 'sameHeadword 统一连字 œ/oe');
    assert(!DimText.sameHeadword('ou', 'où'), 'sameHeadword 不把 ou 和 où 当成同一个词');
  });

  // ===== utils: 占位释义清洗 =====
  // 见 audit: it-placeholder-glosses-shown-to-user —— 词库里有 1220 条 "(2)" 残留
  group('DimText 占位释义', function () {
    assertEqual(DimText.cleanGloss('the (feminine); (2); (3)'), 'the (feminine)', 'cleanGloss 删掉 (2)/(3) 占位义项');
    assertEqual(DimText.cleanGloss('I; (2)'), 'I', 'cleanGloss 处理 "I; (2)"');
    assertEqual(DimText.cleanGloss('to do; to make; (2)'), 'to do; to make', 'cleanGloss 保留真实义项');
    assertEqual(DimText.cleanGloss('（阴性定冠词）; (二); (三) 国家'), '（阴性定冠词）; 国家',
      'cleanGloss 保留中文括号说明，只删编号占位');
    assertEqual(DimText.cleanGloss('(2)'), '(2)', 'cleanGloss 全是占位时退回原文，绝不返回空选项');
    assert(DimText.isPlaceholderGloss('(2); (3)'), 'isPlaceholderGloss 识别纯占位释义');
    assert(!DimText.isPlaceholderGloss('the (feminine); (2)'), '有真义项的释义不算占位');
    assert(!DimText.isPlaceholderGloss('（阴性定冠词）'), '中文括号说明不是占位符');
  });

  // ===== cleanGloss 必须是非破坏性的 =====
  // 见 review: cleanGloss-rewrites-15346-glosses —— 旧实现无条件按 [;；,，、/／|｜]
  // 重切并用 "; " 重拼，改写了 24000 条英文释义里 15346 条**没有任何占位符**的展示文本，
  // 还会切到括号里面去（"[数、物]" → "[数; 物]"）。
  // 这条链路是 displayGloss → 每个选项文字 + "回答有误，正确答案是：" 横幅。
  group('cleanGloss 非破坏性', function () {
    // 括号 / 方括号 / 中文括号内部的分隔符不是义项分隔符
    assertEqual(DimText.cleanGloss('n.[数、物]常数,恒量adj.不变的,持续的,坚决的'),
      'n.[数、物]常数,恒量adj.不变的,持续的,坚决的', '[数、物] 里的顿号不会被当成分隔符');
    assertEqual(DimText.cleanGloss('star (TV/music)'), 'star (TV/music)', '括号里的 / 不会被改成分号');
    assertEqual(DimText.cleanGloss('I mean, you know what?'), 'I mean, you know what?',
      '英文逗号原样保留，不会变成 "I mean; you know what?"');
    assertEqual(DimText.cleanGloss('prep.向,往,给...,于...,直到...为止,...,[表示程度、范围] 到,达'),
      'prep.向,往,给...,于...,直到...为止,...,[表示程度、范围] 到,达',
      '[表示程度、范围] 与省略号义项都不被改写');
    assertEqual(DimText.cleanGloss('定冠词 (阴性/复数); 见 der'), '定冠词 (阴性/复数); 见 der',
      '(阴性/复数) 保持完整');
    assertEqual(DimText.cleanGloss('n.(一)对,(一)双,夫妇'), 'n.(一)对,(一)双,夫妇',
      '没有占位义项时，"(一)" 这种量词标记一个都不动');

    // 没有占位符时逐字节返回原文（含首尾空白）
    var untouched = ['hello', 'a, b, c', 'a; b', '中文, 释义', ' padded ', 'x/y', 'to be|to exist'];
    var rewritten = untouched.filter(function (s) { return DimText.cleanGloss(s) !== s; });
    assertEqual(rewritten.length, 0, '不含占位义项的释义 cleanGloss 后逐字节不变（' +
      JSON.stringify(rewritten) + '）');

    // 真的有占位义项时才动手，而且用原来的分隔符重拼
    assertEqual(DimText.cleanGloss('a,(2),b'), 'a,b', '删占位义项后用原来的逗号重拼，不改成 "; "');
    assertEqual(DimText.cleanGloss('a; (2); b'), 'a; b', '原来是分号就还用分号');
    assertEqual(DimText.cleanGloss('(2); star (TV/music)'), 'star (TV/music)',
      '删掉前导占位后不留下多余分隔符和空白');
    assertEqual(DimText.cleanGloss(''), '', 'cleanGloss 处理空串');
    assertEqual(DimText.cleanGloss(null), '', 'cleanGloss 处理 null');

    // 只有**带括号的编号**才是占位符。裸数字义项在真实数据里全是真释义：
    // score = "…,二十,…"、ein = "一, 一个, 某人, 某物"、quindici = "15"，
    // 删掉它们就是在改词义（旧实现正是这么干的）。
    assertEqual(DimText.cleanGloss('n.得分,乐谱,二十,终点线'), 'n.得分,乐谱,二十,终点线',
      '裸数字义项 "二十"（score 的真义项）不会被当成占位符删掉');
    assertEqual(DimText.cleanGloss('一, 一个, 某人, 某物'), '一, 一个, 某人, 某物',
      '德语 ein 的 "一" 是真释义，必须保留');
    assertEqual(DimText.cleanGloss('fifteen; 15'), 'fifteen; 15', '英文义项后的数字释义保留');
    assertEqual(DimText.cleanGloss('n.技能,,技巧'), 'n.技能,,技巧',
      '空片段也不改写（展示层不负责修数据）');
    // 但带括号的编号占位仍然要删干净
    assertEqual(DimText.cleanGloss('二; (2)'), '二', '"(2)" 删掉，同一条里的裸数字义项 "二" 留下');
    assertEqual(DimText.cleanGloss('the; 【二】'), 'the', '【二】 这种编号占位同样删掉');
  });

  // ===== cleanGloss 的重复 token 兜底 =====
  // 见 scripts/clean_italian_glosses.py —— 机翻管线在数据里留了 "road road" /
  // "赢赢赢赢" 这类重复，会直接漏进选项文字。数据已清洗，这里是运行时兜底
  // （自定义词本等来源还会带进同样的垃圾）。对半重复（"High school high
  // school"）只在数据层处理，这里故意不动 —— "school"/"high" 相邻并不重复。
  group('cleanGloss 重复 token 兜底', function () {
    assertEqual(DimText.cleanGloss('road road'), 'road', '相邻重复 token 折叠');
    assertEqual(DimText.cleanGloss('赢赢赢赢'), '赢', '纯 CJK 词自身重复折叠到最小单元');
    assertEqual(DimText.cleanGloss('奶油奶油 奶油 奶油'), '奶油', 'CJK 折叠与相邻折叠互相催化');
    assertEqual(DimText.cleanGloss('Nothing.; Nothing'), 'Nothing.; Nothing',
      '不算重复的两个不同义项原样保留（句点 participates）');
    assertEqual(DimText.cleanGloss('High school high school'), 'High school high school',
      '对半重复是数据层的活，运行时不动');
    assertEqual(DimText.cleanGloss('Bonbon'), 'Bonbon', '拉丁重复词形是真实单词，不折叠');
    // AA 型叠词是真实中文词，运行时一律保留（此前 "妈妈" 被折成 "妈"）
    ['妈妈', '谢谢', '常常', '猩猩', '母亲; 妈妈'].forEach(function (w) {
      assertEqual(DimText.cleanGloss(w), w, 'AA 型叠词 "' + w + '" 原样保留');
    });
    assertEqual(DimText.cleanGloss('妈妈 妈妈'), '妈妈', 'AA 叠词的相邻重复仍折叠到一份');
    assertEqual(DimText.cleanGloss('n.[数、物]常数,恒量'), 'n.[数、物]常数,恒量',
      '没有重复时逐字节返回原文');
  });

  // ===== utils: 义项重叠 / 同义判定 =====
  group('DimText 义项比较', function () {
    assert(DimText.glossesOverlap('search; look for', 'search'), '"search" 与 "search; look for" 同义');
    assert(DimText.glossesOverlap('to search', 'search'), '忽略英文不定式的 to');
    assert(DimText.glossesOverlap('they search', 'search'), '整词包含算同义');
    assert(!DimText.glossesOverlap('book', 'cookbook'), '子串但非整词：book ≠ cookbook');
    assert(!DimText.glossesOverlap('on', 'one'), '两字母义项不做包含匹配');
    assert(DimText.glossesOverlap('谁', 'pron.谁,那…的(人)'), '中文义项忽略词性前缀与括号说明');
    assert(DimText.sameMeaning('search', 'search; look for'), 'sameMeaning：义项子集算同一个意思');
    assert(!DimText.sameMeaning('house', 'thing'), 'sameMeaning：不相干释义不算同一个意思');
  });

  // ===== utils: 转义 =====
  group('escapeHtml / escapeAttribute / renderIcon', function () {
    assertEqual(escapeHtml('<script>alert("xss")<\/script>'), '&lt;script&gt;alert(&quot;xss&quot;)&lt;/script&gt;', 'escapeHtml escapes HTML special chars');
    assertEqual(escapeHtml("it's"), 'it&#39;s', 'escapeHtml escapes single quotes');
    assertEqual(escapeHtml(null), '', 'escapeHtml handles null');
    assertEqual(escapeHtml(undefined), '', 'escapeHtml handles undefined');
    assertEqual(escapeHtml(123), '123', 'escapeHtml handles numbers');
    assertEqual(escapeAttribute('`test`'), '&#96;test&#96;', 'escapeAttribute escapes backticks');

    var icon = renderIcon('icon-brand');
    assert(icon.indexOf('<svg') !== -1, 'renderIcon returns SVG markup');
    assert(icon.indexOf('#icon-brand') !== -1, 'renderIcon includes icon name');
  });

  // ===== word-similarity: editDistance =====
  group('editDistance', function () {
    assertEqual(WordSimilarity.editDistance('casa', 'cosa'), 1, 'editDistance casa/cosa = 1');
    assertEqual(WordSimilarity.editDistance('casa', 'casa'), 0, 'editDistance identical = 0');
    assertEqual(WordSimilarity.editDistance('kitten', 'sitting'), 3, 'editDistance kitten/sitting = 3');
    assertEqual(WordSimilarity.editDistance('caffè', 'caffe'), 0, 'editDistance is accent-insensitive');
    assertEqual(WordSimilarity.boundedEditDistance('kitten', 'sitting', 2), 3, 'boundedEditDistance 超过上限时提前退出并返回 > max');
  });

  var simPrompt = { italian: 'casa', english: 'house', rank: 50 };
  var simPool = [
    simPrompt,
    { italian: 'cosa', english: 'thing', rank: 60 },
    { italian: 'caso', english: 'case', rank: 70 },
    { italian: 'cassa', english: 'crate', rank: 80 },
    { italian: 'aeroplano', english: 'airplane', rank: 90 },
    { italian: 'montagna', english: 'mountain', rank: 95 }
  ];

  group('pickConfusableDistractors 相近词优先', function () {
    var simPicked = WordSimilarity.pickConfusableDistractors(simPrompt, simPool,
      { count: 3, windowSize: 3, sourceField: 'italian', targetField: 'english', correctTarget: 'house' });
    var simSrcs = simPicked.map(function (w) { return w.italian; });
    assertEqual(simPicked.length, 3, 'pickConfusableDistractors returns 3');
    assert(simSrcs.indexOf('aeroplano') === -1 && simSrcs.indexOf('montagna') === -1, 'distant words are excluded from the closest window');
    assert(simSrcs.indexOf('casa') === -1, 'prompt word itself is excluded');
  });

  group('pickConfusableDistractors 短词按词频取邻居', function () {
    var shortPrompt = { italian: 'e', english: 'and', rank: 1 };
    var shortPool = [
      shortPrompt,
      { italian: 'di', english: 'of', rank: 2 },
      { italian: 'ed', english: 'as well as', rank: 3 },
      { italian: 'la', english: 'the', rank: 4 },
      { italian: 'è', english: 'is', rank: 200 }
    ];
    var shortPicked = WordSimilarity.pickConfusableDistractors(shortPrompt, shortPool,
      { count: 3, windowSize: 3, sourceField: 'italian', targetField: 'english', correctTarget: 'and' });
    var shortSrcs = shortPicked.map(function (w) { return w.italian; });
    assertEqual(shortPicked.length, 3, 'short prompt still yields 3 distractors');
    assert(shortSrcs.indexOf('è') === -1, 'short prompt ranks by frequency, excluding far-rank edit-close decoy');
  });

  group('pickConfusableDistractors 释义去重', function () {
    var dupPrompt = { italian: 'mela', english: 'apple', rank: 10 };
    var dupPool = [
      dupPrompt,
      { italian: 'mona', english: 'X', rank: 11 },
      { italian: 'mola', english: 'Y', rank: 12 },
      { italian: 'mara', english: 'Z', rank: 13 },
      { italian: 'meta', english: 'apple', rank: 14 }
    ];
    var dupPicked = WordSimilarity.pickConfusableDistractors(dupPrompt, dupPool,
      { count: 3, sourceField: 'italian', targetField: 'english', correctTarget: 'apple' });
    var dupTgts = dupPicked.map(function (w) { return w.english; });
    var dupUnique = [];
    dupTgts.forEach(function (t) { if (dupUnique.indexOf(t) === -1) dupUnique.push(t); });
    assertEqual(dupUnique.length, dupTgts.length, 'distractor target texts are unique');
    assert(dupTgts.indexOf('apple') === -1, 'distractors never equal the correct answer text');
  });

  // ===== 回归：干扰项不能与正确答案同义 =====
  // 见 audit: it-mc-distractors-synonymous-with-answer
  // 线上截图：提示 "cercare"，选项是 search / Lost / Stop / "search; look for"
  // —— cerca("search") 与正确答案 "search; look for" 是同一个意思，题目无解。
  group('回归 cercare：同义词不能当干扰项', function () {
    var cercare = { italian: 'cercare', english: 'search; look for', rank: 100 };
    var cercarePool = [
      cercare,
      { italian: 'cerca', english: 'search', rank: 101 },
      { italian: 'cercano', english: 'they search', rank: 102 },
      { italian: 'cantare', english: 'to sing', rank: 103 },
      { italian: 'cenare', english: 'to have dinner', rank: 104 },
      { italian: 'creare', english: 'to create', rank: 105 },
      { italian: 'curare', english: 'to treat', rank: 106 },
      { italian: 'cedere', english: 'to yield', rank: 107 }
    ];
    var synonymHits = 0, shortRuns = 0;
    for (var run = 0; run < 20; run++) {
      var picked = WordSimilarity.pickConfusableDistractors(cercare, cercarePool, {
        count: 3, sourceField: 'italian', targetField: 'english', correctTarget: cercare.english
      });
      if (picked.length < 3) shortRuns++;
      picked.forEach(function (w) {
        if (w.italian === 'cerca' || w.italian === 'cercano') synonymHits++;
      });
    }
    assertEqual(synonymHits, 0, '20 次抽样里 cerca / cercano 从未被选为 "cercare" 的干扰项');
    assertEqual(shortRuns, 0, '剔除同义词后仍能凑满 3 个干扰项');

    // 同样的规则要作用在整条链路上，而不只是 WordSimilarity
    var cercareEngine = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: cercare },
      difficulty: 'hard'
    });
    var opts = cercareEngine.generateOptions(cercare.english, cercarePool);
    assertEqual(opts.length, 4, 'generateOptions 仍返回 4 个选项');
    var overlapping = opts.filter(function (o) {
      return o !== cercare.english && DimText.glossesOverlap(o, cercare.english);
    });
    assertEqual(overlapping.length, 0, 'hard 模式的选项里没有与正确答案同义的');

    // easy 模式走的是随机分支，同样不能出同义项
    var easyCercare = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: cercare },
      difficulty: 'easy'
    });
    var easyOverlap = 0;
    for (var e = 0; e < 20; e++) {
      easyCercare.generateOptions(cercare.english, cercarePool).forEach(function (o) {
        if (o !== cercare.english && DimText.glossesOverlap(o, cercare.english)) easyOverlap++;
      });
    }
    assertEqual(easyOverlap, 0, 'easy 模式的选项里也没有同义项');
  });

  // ===== 回归：占位释义不能出现在选项里 =====
  group('回归：占位释义不出题也不当选项', function () {
    var prompt = { italian: 'e', english: 'and', rank: 1 };
    var pool = [
      prompt,
      { italian: 'ed', english: 'and(2)', rank: 2 },       // 同义 + 占位残留
      { italian: 'ei', english: '(2)', rank: 3 },          // 纯占位
      { italian: 'di', english: 'of', rank: 4 },
      { italian: 'la', english: 'the', rank: 5 },

  group('MasteryPolicy.record 契约：streak 生命周期', function () {

      assertEqual(MasteryPolicy.getStreak(LANG, 'w'), i, 'streak 被持久化：' + i);
    }
    // 第 N 次才算

    assertEqual(MasteryPolicy.getStreak(LANG, 'w'), 0, '掌握后 streak 条目从存储里清掉');

    var wrong = MasteryPolicy.record(LANG, 'x', false, {});
    assertEqual(wrong.streak, 0, '在门槛前一步答错，streak 归零');

      var promptWord = big[(q * 79) % big.length];
      WordSimilarity.pickConfusableDistractors(promptWord, big, {
        count: 3, sourceField: 'italian', targetField: 'english', correctTarget: promptWord.english
      });
    }
    var elapsed = Date.now() - start;
    assert(elapsed < 3000, '8000 词池出 100 道题应远快于全表扫描（实测 ' + elapsed + ' ms）');
  });

  // ===== 出题方向（正向=看外语选释义 / 反向=看释义选外语） =====
  group('出题方向 API', function () {
    var KEYS = ['dimenticato_quiz_direction'];
    QuizEngine.LANGUAGES.forEach(function (l) { KEYS.push(QuizEngine.directionKeyFor(l)); });
    KEYS.forEach(function (k) { localStorage.removeItem(k); });

    assertEqual(typeof QuizEngine.getDirection, 'function', 'QuizEngine.getDirection exists');
    assertEqual(QuizEngine.getDirection(), 'forward', 'direction defaults to forward when unset');

    QuizEngine.setDirection('reverse', 'german');
    assertEqual(QuizEngine.getDirection('german'), 'reverse', '分语言方向：德语改成反向');
    assertEqual(QuizEngine.getDirection('italian'), 'forward', '分语言方向不影响其它语言');
    assertEqual(QuizEngine.getDirection(), 'forward', '分语言方向不改全局默认');

    QuizEngine.setDirection('reverse');
    assertEqual(QuizEngine.getDirection(), 'reverse', '全局反向生效');
    assertEqual(QuizEngine.getDirection('german'), 'reverse', '全局设置会清掉分语言覆盖');

    var frEngine = makeEngine({ language: 'french', fieldMap: { source: 'french', target: 'meaning' } });
    assertEqual(frEngine.isReverse(), true, '引擎按全局设置读到反向');
    assertEqual(frEngine.shouldSpeakQuestion(), false, '反向模式不朗读题面（答案就是词形）');
    KEYS.forEach(function (k) { localStorage.removeItem(k); });
    assertEqual(frEngine.isReverse(), false, '清除设置后回到正向');
    assertEqual(frEngine.shouldSpeakQuestion(), true, '正向模式正常朗读题面');
    KEYS.forEach(function (k) { localStorage.removeItem(k); });
  });

  group('反向选项生成', function () {
    var KEYS = ['dimenticato_quiz_direction'];
    QuizEngine.LANGUAGES.forEach(function (l) { KEYS.push(QuizEngine.directionKeyFor(l)); });
    KEYS.forEach(function (k) { localStorage.removeItem(k); });
    QuizEngine.setDirection('reverse');

    var pool = [
      { italian: 'casa', english: 'house' },
      { italian: 'cane', english: 'dog' },
      { italian: 'gatto', english: 'cat' },
      { italian: 'porta', english: 'door' },
      { italian: 'tavolo', english: 'table' }
    ];
    var prompt = pool[0];

    var revEngine = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: prompt },
      difficulty: 'easy'
    });
    assertEqual(revEngine.questionTextFor(prompt), 'house', '反向题面显示释义');
    assertEqual(revEngine.correctAnswerFor(prompt), 'casa', '反向正确答案是外语词形');

    var options = revEngine.generateOptions('casa', pool);
    assertEqual(options.length, 4, '反向也生成 4 个选项');
    assert(options.indexOf('casa') !== -1, '反向选项包含正确外语词形');
    var italianValues = pool.map(function (w) { return w.italian; });
    assert(options.every(function (o) { return italianValues.indexOf(o) !== -1; }),
      '反向选项全部来自外语词形字段');
    assert(options.every(function (o) { return o !== 'house' && o !== 'dog'; }),
      '反向选项不再混入释义');

    // 同义 twin：两个词条释义相同，反向题里两个选项都"对"，必须排除
    var twinPool = [
      { italian: 'casa', english: 'house' },
      { italian: 'dimora', english: 'house' },
      { italian: 'cane', english: 'dog' },
      { italian: 'gatto', english: 'cat' },
      { italian: 'porta', english: 'door' }
    ];
    var twinEngine = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: twinPool[0] },
      difficulty: 'easy'
    });
    var twinOptions = twinEngine.generateOptions('casa', twinPool);
    assert(twinOptions.indexOf('dimora') === -1, '反向排除同义词条（释义相同的 twin）');
    assertEqual(twinOptions.length, 4, '排除 twin 后仍凑满 4 个选项');

    // hard + reverse：干扰项按外语拼写相近挑选
    var hardPool = [
      { italian: 'cane', english: 'dog', rank: 10 },
      { italian: 'casa', english: 'house', rank: 20 },
      { italian: 'cara', english: 'dear', rank: 30 },
      { italian: 'cava', english: 'cave', rank: 40 },
      { italian: 'zona', english: 'zone', rank: 50 }
    ];
    var hardRev = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: hardPool[0] },
      difficulty: 'hard'
    });
    var hardRevOptions = hardRev.generateOptions('cane', hardPool);
    assertEqual(hardRevOptions.length, 4, 'hard+reverse 生成 4 个选项');
    assert(hardRevOptions.indexOf('cane') !== -1, 'hard+reverse 包含正确词形');
    assert(hardRevOptions.indexOf('zona') === -1, '拼写不相近的词不进入 hard+reverse 选项');

    // 正向回归：行为与方向功能加入前一致
    KEYS.forEach(function (k) { localStorage.removeItem(k); });
    var fwdEngine = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: prompt },
      difficulty: 'easy'
    });
    assertEqual(fwdEngine.questionTextFor(prompt), 'casa', '正向题面显示外语词形');
    assertEqual(fwdEngine.correctAnswerFor(prompt), 'house', '正向正确答案是释义');
    var fwdOptions = fwdEngine.generateOptions('house', pool);
    assert(fwdOptions.indexOf('house') !== -1, '正向选项包含正确释义');
    assert(fwdOptions.every(function (o) { return italianValues.indexOf(o) === -1; }),
      '正向选项仍是释义而非词形');
    KEYS.forEach(function (k) { localStorage.removeItem(k); });
  });

  group('出题方向控件', function () {
    var html = QuizEngine.renderDirectionToggle('german');
    assert(html.indexOf('data-direction-lang="german"') !== -1, '分语言方向控件带语言标记');
    assert(html.indexOf('data-direction="reverse"') !== -1, '方向控件含反向按钮');
    assert(html.indexOf('data-direction="forward"') !== -1, '方向控件含正向按钮');
    var global = QuizEngine.renderDirectionToggle();
    assert(global.indexOf('data-direction-lang') === -1, '不传语言时是全局控件');
  });

  // ===== lib/utils.js：debounce / deferredPersist（大词表搜索防抖 + 延迟落盘） =====
  // 注意：headless runner 同步收结果，这里只测同步可见的契约；
  // 「防抖/延迟到期后真的执行」由浏览器冒烟覆盖。
  group('debounce / deferredPersist', function () {
    assert(typeof window.debounce === 'function', 'debounce 已暴露到 window');
    assert(typeof window.deferredPersist === 'function', 'deferredPersist 已暴露到 window');

    // debounce：防抖窗口内的连续调用一个都不立即执行
    var calls = [];
    var debounced = window.debounce(function (v) { calls.push(v); }, 5000);
    debounced('a'); debounced('ab'); debounced('abc');
    assertEqual(calls.length, 0, '防抖窗口内不执行');

    // deferredPersist：脏标记合并 + 手动冲刷语义（导出 / 关闭页前用得上）
    var writes = 0;
    var persist = window.deferredPersist(function () { writes++; }, 5000);
    persist(); persist(); persist();
    assertEqual(writes, 0, '延迟窗口内不落盘');
    persist.flush();
    assertEqual(writes, 1, '多次脏标记合并成一次写');
    persist.flush();
    assertEqual(writes, 1, '无脏数据时 flush 是空操作');
    persist();
    window.DimenticatoUtils.flushAllPersisters();
    assertEqual(writes, 2, 'flushAllPersisters 冲刷全部实例');

    // 有界干扰项采样：generateOptions 的 easy/回退路径对池做整表 filter+洗牌，
    // 24k+ 全池直接喂进来每题几十毫秒。采样必须把池压到常数上界。
    assert(typeof QuizEngine.sampleDistractorPool === 'function', 'sampleDistractorPool 是共享静态方法');
    var tinyPool = [{ italian: 'a', english: 'g1' }, { italian: 'b', english: 'g2' }];
    assertEqual(QuizEngine.sampleDistractorPool(tinyPool, tinyPool[0]).length, 2,
      '小池原样返回（不超过池大小）');
    var bigPool = [];
    for (var bi = 0; bi < 5000; bi++) bigPool.push({ italian: 'w' + bi, english: 'g' + bi, rank: bi + 1 });
    var sampled = QuizEngine.sampleDistractorPool(bigPool, bigPool[2500]);
    assert(sampled.length <= 800, '大池采样结果不超过上界 800（实际 ' + sampled.length + '）');
    assert(sampled.length >= 400, '采样结果足够大（覆盖词频段，实际 ' + sampled.length + '）');
    var sampledNoRank = QuizEngine.sampleDistractorPool(bigPool, null);
    assert(sampledNoRank.length > 0 && sampledNoRank.length <= 800, '无当前词时等距抽样兜底');
  });

  // ===== PracticeFlow：四语言共享的选择题判分流程 =====
  group('PracticeFlow.mcAnswer', function () {
    assert(typeof window.PracticeFlow === 'object', 'PracticeFlow 已暴露到 window');
    if (typeof window.PracticeFlow !== 'object') return;

    function fakeButton(answer) {
      return {
        dataset: { answer: answer },
        classList: {
          removed: [], added: [],
          remove: function (c) { this.removed.push(c); },
          add: function (c) { this.added.push(c); }
        }
      };
    }

    var classStub = { remove: function () {}, add: function () {} };
    var engine = makeEngine({
      difficulty: 'easy',
      dom: {
        optionsContainer: { querySelectorAll: function () { return []; } },
        feedbackEl: { innerHTML: '', classList: classStub },
        feedbackTextEl: { innerHTML: '', classList: classStub }
      }
    });
    var recorded = [];
    window.StatsManager = { recordActivity: function (lang, d) { recorded.push([lang, d]); } };
    try {
      var env = {
        lang: 'italian',
        engine: engine,
        button: fakeButton('house'),
        word: { italian: 'casa', english: 'house' },
        state: { quizTotal: 0, quizCorrect: 0 },
        stats: { mcAttempts: 0, mcCorrect: 0 },
        masteryHooked: 0, saveCalls: 0, nextCalls: 0,
        recordMastery: function () { this.masteryHooked++; },
        save: function () { this.saveCalls++; },
        next: function () { this.nextCalls++; },
        nextDelay: 1,
        startedAt: 0
      };
      var newStart = window.PracticeFlow.mcAnswer(env);

      assertEqual(env.state.quizTotal, 1, '答对：quizTotal +1');
      assertEqual(env.stats.mcAttempts, 1, '答对：mcAttempts +1');
      assertEqual(env.stats.mcCorrect, 1, '答对：mcCorrect +1');
      assertEqual(env.state.quizCorrect, 1, '答对：quizCorrect +1');
      assertEqual(env.masteryHooked, 1, '掌握策略被调用一次');
      assertEqual(env.saveCalls, 1, 'save 被调用一次');
      assert(typeof newStart === 'number' && newStart > 0, '返回新一题的开始时刻');
      assert(recorded.length === 1 && recorded[0][0] === 'italian', '遥测按语言记录一次');
      assertEqual(recorded[0][1].correct, 1, '遥测记录答对');
      assertEqual(recorded[0][1].total, 1, '遥测只记一题（不再有差分双计数）');

      // 答错路径
      var env2 = {
        lang: 'italian',
        engine: engine,
        button: fakeButton('wrong-gloss'),
        word: { italian: 'casa', english: 'house' },
        state: { quizTotal: 0, quizCorrect: 0 },
        stats: { mcAttempts: 0, mcCorrect: 0 },
        nextCalls: 0,
        save: function () {},
        next: function () { this.nextCalls++; },
        startedAt: 0
      };
      window.PracticeFlow.mcAnswer(env2);
      assertEqual(env2.stats.mcCorrect, 0, '答错：mcCorrect 不加');
      assert(env2.button.classList.added.indexOf('wrong') !== -1, '答错：按钮标 wrong');
      assertEqual(env2.nextCalls, 0, '答错不自动下一题');

      // 空词守卫
      var env3 = {
        lang: 'italian', engine: engine, button: fakeButton('x'), word: null,
        state: { quizTotal: 0, quizCorrect: 0 }, stats: { mcAttempts: 0, mcCorrect: 0 },
        startedAt: 0
      };
      var r3 = window.PracticeFlow.mcAnswer(env3);
      assertEqual(env3.state.quizTotal, 0, '空词时直接返回不计数');
      assert(r3 === 0, '空词时返回 startedAt 原值');
    } finally {
      delete window.StatsManager;
    }
  });

  // --- Summary ---
  var summary = document.createElement('div');
  summary.className = 'summary';
  summary.textContent = passed + ' passed, ' + failed + ' failed' + (known ? ', ' + known + ' known issues' : '');
  summary.style.color = failed === 0 ? '#2ecc71' : '#e74c3c';
  results.insertBefore(summary, results.firstChild);
})();
</script>
