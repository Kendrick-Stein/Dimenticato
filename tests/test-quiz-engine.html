<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizEngine Tests</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; background: #f5f7fa; color: #2c3e50; }
    h1 { border-bottom: 2px solid #3498db; padding-bottom: 0.5rem; }
    .pass { color: #2ecc71; } .fail { color: #e74c3c; } .known { color: #b8860b; }
    .test { margin: 0.5rem 0; padding: 0.5rem 1rem; border-left: 3px solid #ddd; background: #fff; }
    .test.pass { border-left-color: #2ecc71; } .test.fail { border-left-color: #e74c3c; }
    .test.known { border-left-color: #f0ad4e; }
    .summary { font-size: 1.2rem; font-weight: bold; margin: 1rem 0; }
    .note { color: #7f8c8d; font-size: 0.9rem; }
  </style>
</head>
<body>
<h1>QuizEngine Tests</h1>
<p class="note">覆盖 lib/utils.js（DimText 归一化）、lib/word-similarity.js（干扰项挑选）、
lib/quiz-engine.js（选项生成、判分、掌握度、难度偏好）。</p>
<div id="results"></div>

<script src="../lib/utils.js"></script>
<script src="../lib/word-similarity.js"></script>
<script src="../lib/quiz-engine.js"></script>
<script>
(function () {
  var results = document.getElementById('results');
  var passed = 0, failed = 0, known = 0;

  function row(cls, message) {
    var div = document.createElement('div');
    div.className = 'test ' + cls;
    div.textContent = message;
    results.appendChild(div);
  }

  function assert(condition, message) {
    if (condition) { passed++; row('pass', 'PASS: ' + message); }
    else { failed++; row('fail', 'FAIL: ' + message); }
  }

  function assertEqual(actual, expected, message) {
    var ok = actual === expected;
    if (ok) { passed++; row('pass', 'PASS: ' + message); }
    else {
      failed++;
      row('fail', 'FAIL: ' + message
        + ' (expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual) + ')');
    }
  }

  // 已确认、但归属其它工作流的缺陷：记录但不判红
  function knownIssue(condition, message, owner) {
    if (condition) { passed++; row('pass', 'PASS (was known issue): ' + message); }
    else { known++; row('known', 'KNOWN ISSUE [' + owner + ']: ' + message); }
  }

  // 一个分组抛错不该吞掉后面的测试和汇总行
  function group(name, fn) {
    try {
      fn();
    } catch (e) {
      failed++;
      row('fail', 'FAIL: ' + name + ' 抛错 — ' + (e && e.message ? e.message : e));
    }
  }

  function makeEngine(extra) {
    var config = {
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: null },
      stats: {},
      mastered: new Set(),
      fieldMap: { source: 'italian', target: 'english' },
      saveFn: function () {},
      onUpdateStats: function () {},
      dom: {}
    };
    for (var k in (extra || {})) config[k] = extra[k];
    return new QuizEngine(config);
  }

  var engine = makeEngine();

  // ===== utils: shuffleArray =====
  group('shuffleArray', function () {
    var input = [1, 2, 3, 4, 5];
    var shuffled = engine.shuffleArray(input);
    assert(Array.isArray(shuffled), 'shuffleArray returns an array');
    assertEqual(shuffled.length, 5, 'shuffleArray preserves length');
    assertEqual(shuffled.sort().join(','), '1,2,3,4,5', 'shuffleArray preserves all elements');
  });

  // ===== quiz-engine: generateOptions 基本性质 =====
  group('generateOptions', function () {
    engine.config.state.currentWord = { italian: 'ciao', english: 'hello' };
    var wordPool = [
      { italian: 'ciao', english: 'hello' },
      { italian: 'grazie', english: 'thank you' },
      { italian: 'prego', english: "you're welcome" },
      { italian: 'buongiorno', english: 'good morning' },
      { italian: 'arrivederci', english: 'goodbye' }
    ];
    var options = engine.generateOptions('hello', wordPool);
    assertEqual(options.length, 4, 'generateOptions returns 4 options');
    assert(options.indexOf('hello') !== -1, 'options include correct answer');

    var unique = [];
    options.forEach(function (o) { if (unique.indexOf(o) === -1) unique.push(o); });
    assertEqual(unique.length, options.length, 'options have no duplicates');

    engine.config.state.currentWord = { italian: 'ciao', english: 'hello' };
    var smallPool = [
      { italian: 'ciao', english: 'hello' },
      { italian: 'grazie', english: 'thank you' },
      { italian: 'buongiorno', english: 'good morning' }
    ];
    var options2 = engine.generateOptions('hello', smallPool);
    var helloCount = options2.filter(function (o) { return o === 'hello'; }).length;
    assertEqual(helloCount, 1, 'correct answer appears exactly once in options');
  });

  // ===== utils: 重音策略 =====
  // 抹重音只用于"宽松比较"；去重 / 索引必须保留重音，否则 ou 和 où 会被合并掉
  group('DimText 重音策略', function () {
    assert(typeof DimText === 'object', 'DimText 已暴露到 window');
    assertEqual(engine.normalizeString('caffè'), engine.normalizeString('caffe'), 'normalizeString strips accents (caffè vs caffe)');
    assertEqual(engine.normalizeString('  CIAO  '), 'ciao', 'normalizeString trims and lowercases');
    assertEqual(engine.normalizeString('È'), 'e', 'normalizeString handles capital accented letters');

    assert(DimText.headwordKey('ou') !== DimText.headwordKey('où'), 'headwordKey 保留重音：ou ≠ où');
    assert(DimText.headwordKey('la') !== DimText.headwordKey('là'), 'headwordKey 保留重音：la ≠ là');
    assert(DimText.headwordKey('diner') !== DimText.headwordKey('dîner'), 'headwordKey 保留重音：diner ≠ dîner');
    assertEqual(DimText.looseKey('ou'), DimText.looseKey('où'), 'looseKey 抹掉重音：ou == où');
    assertEqual(DimText.headwordKey('Internet'), DimText.headwordKey('internet'), 'headwordKey 仍然忽略大小写');
    assert(DimText.sameHeadword('sœur', 'soeur'), 'sameHeadword 统一连字 œ/oe');
    assert(!DimText.sameHeadword('ou', 'où'), 'sameHeadword 不把 ou 和 où 当成同一个词');
  });

  // ===== utils: 占位释义清洗 =====
  // 见 audit: it-placeholder-glosses-shown-to-user —— 词库里有 1220 条 "(2)" 残留
  group('DimText 占位释义', function () {
    assertEqual(DimText.cleanGloss('the (feminine); (2); (3)'), 'the (feminine)', 'cleanGloss 删掉 (2)/(3) 占位义项');
    assertEqual(DimText.cleanGloss('I; (2)'), 'I', 'cleanGloss 处理 "I; (2)"');
    assertEqual(DimText.cleanGloss('to do; to make; (2)'), 'to do; to make', 'cleanGloss 保留真实义项');
    assertEqual(DimText.cleanGloss('（阴性定冠词）; (二); (三) 国家'), '（阴性定冠词）; 国家',
      'cleanGloss 保留中文括号说明，只删编号占位');
    assertEqual(DimText.cleanGloss('(2)'), '(2)', 'cleanGloss 全是占位时退回原文，绝不返回空选项');
    assert(DimText.isPlaceholderGloss('(2); (3)'), 'isPlaceholderGloss 识别纯占位释义');
    assert(!DimText.isPlaceholderGloss('the (feminine); (2)'), '有真义项的释义不算占位');
    assert(!DimText.isPlaceholderGloss('（阴性定冠词）'), '中文括号说明不是占位符');
  });

  // ===== cleanGloss 必须是非破坏性的 =====
  // 见 review: cleanGloss-rewrites-15346-glosses —— 旧实现无条件按 [;；,，、/／|｜]
  // 重切并用 "; " 重拼，改写了 24000 条英文释义里 15346 条**没有任何占位符**的展示文本，
  // 还会切到括号里面去（"[数、物]" → "[数; 物]"）。
  // 这条链路是 displayGloss → 每个选项文字 + "回答有误，正确答案是：" 横幅。
  group('cleanGloss 非破坏性', function () {
    // 括号 / 方括号 / 中文括号内部的分隔符不是义项分隔符
    assertEqual(DimText.cleanGloss('n.[数、物]常数,恒量adj.不变的,持续的,坚决的'),
      'n.[数、物]常数,恒量adj.不变的,持续的,坚决的', '[数、物] 里的顿号不会被当成分隔符');
    assertEqual(DimText.cleanGloss('star (TV/music)'), 'star (TV/music)', '括号里的 / 不会被改成分号');
    assertEqual(DimText.cleanGloss('I mean, you know what?'), 'I mean, you know what?',
      '英文逗号原样保留，不会变成 "I mean; you know what?"');
    assertEqual(DimText.cleanGloss('prep.向,往,给...,于...,直到...为止,...,[表示程度、范围] 到,达'),
      'prep.向,往,给...,于...,直到...为止,...,[表示程度、范围] 到,达',
      '[表示程度、范围] 与省略号义项都不被改写');
    assertEqual(DimText.cleanGloss('定冠词 (阴性/复数); 见 der'), '定冠词 (阴性/复数); 见 der',
      '(阴性/复数) 保持完整');
    assertEqual(DimText.cleanGloss('n.(一)对,(一)双,夫妇'), 'n.(一)对,(一)双,夫妇',
      '没有占位义项时，"(一)" 这种量词标记一个都不动');

    // 没有占位符时逐字节返回原文（含首尾空白）
    var untouched = ['hello', 'a, b, c', 'a; b', '中文, 释义', ' padded ', 'x/y', 'to be|to exist'];
    var rewritten = untouched.filter(function (s) { return DimText.cleanGloss(s) !== s; });
    assertEqual(rewritten.length, 0, '不含占位义项的释义 cleanGloss 后逐字节不变（' +
      JSON.stringify(rewritten) + '）');

    // 真的有占位义项时才动手，而且用原来的分隔符重拼
    assertEqual(DimText.cleanGloss('a,(2),b'), 'a,b', '删占位义项后用原来的逗号重拼，不改成 "; "');
    assertEqual(DimText.cleanGloss('a; (2); b'), 'a; b', '原来是分号就还用分号');
    assertEqual(DimText.cleanGloss('(2); star (TV/music)'), 'star (TV/music)',
      '删掉前导占位后不留下多余分隔符和空白');
    assertEqual(DimText.cleanGloss(''), '', 'cleanGloss 处理空串');
    assertEqual(DimText.cleanGloss(null), '', 'cleanGloss 处理 null');
  });

  // ===== utils: 义项重叠 / 同义判定 =====
  group('DimText 义项比较', function () {
    assert(DimText.glossesOverlap('search; look for', 'search'), '"search" 与 "search; look for" 同义');
    assert(DimText.glossesOverlap('to search', 'search'), '忽略英文不定式的 to');
    assert(DimText.glossesOverlap('they search', 'search'), '整词包含算同义');
    assert(!DimText.glossesOverlap('book', 'cookbook'), '子串但非整词：book ≠ cookbook');
    assert(!DimText.glossesOverlap('on', 'one'), '两字母义项不做包含匹配');
    assert(DimText.glossesOverlap('谁', 'pron.谁,那…的(人)'), '中文义项忽略词性前缀与括号说明');
    assert(DimText.sameMeaning('search', 'search; look for'), 'sameMeaning：义项子集算同一个意思');
    assert(!DimText.sameMeaning('house', 'thing'), 'sameMeaning：不相干释义不算同一个意思');
  });

  // ===== utils: 转义 =====
  group('escapeHtml / escapeAttribute / renderIcon', function () {
    assertEqual(escapeHtml('<script>alert("xss")<\/script>'), '&lt;script&gt;alert(&quot;xss&quot;)&lt;/script&gt;', 'escapeHtml escapes HTML special chars');
    assertEqual(escapeHtml("it's"), 'it&#39;s', 'escapeHtml escapes single quotes');
    assertEqual(escapeHtml(null), '', 'escapeHtml handles null');
    assertEqual(escapeHtml(undefined), '', 'escapeHtml handles undefined');
    assertEqual(escapeHtml(123), '123', 'escapeHtml handles numbers');
    assertEqual(escapeAttribute('`test`'), '&#96;test&#96;', 'escapeAttribute escapes backticks');

    var icon = renderIcon('icon-brand');
    assert(icon.indexOf('<svg') !== -1, 'renderIcon returns SVG markup');
    assert(icon.indexOf('#icon-brand') !== -1, 'renderIcon includes icon name');
  });

  // ===== word-similarity: editDistance =====
  group('editDistance', function () {
    assertEqual(WordSimilarity.editDistance('casa', 'cosa'), 1, 'editDistance casa/cosa = 1');
    assertEqual(WordSimilarity.editDistance('casa', 'casa'), 0, 'editDistance identical = 0');
    assertEqual(WordSimilarity.editDistance('kitten', 'sitting'), 3, 'editDistance kitten/sitting = 3');
    assertEqual(WordSimilarity.editDistance('caffè', 'caffe'), 0, 'editDistance is accent-insensitive');
    assertEqual(WordSimilarity.boundedEditDistance('kitten', 'sitting', 2), 3, 'boundedEditDistance 超过上限时提前退出并返回 > max');
  });

  var simPrompt = { italian: 'casa', english: 'house', rank: 50 };
  var simPool = [
    simPrompt,
    { italian: 'cosa', english: 'thing', rank: 60 },
    { italian: 'caso', english: 'case', rank: 70 },
    { italian: 'cassa', english: 'crate', rank: 80 },
    { italian: 'aeroplano', english: 'airplane', rank: 90 },
    { italian: 'montagna', english: 'mountain', rank: 95 }
  ];

  group('pickConfusableDistractors 相近词优先', function () {
    var simPicked = WordSimilarity.pickConfusableDistractors(simPrompt, simPool,
      { count: 3, windowSize: 3, sourceField: 'italian', targetField: 'english', correctTarget: 'house' });
    var simSrcs = simPicked.map(function (w) { return w.italian; });
    assertEqual(simPicked.length, 3, 'pickConfusableDistractors returns 3');
    assert(simSrcs.indexOf('aeroplano') === -1 && simSrcs.indexOf('montagna') === -1, 'distant words are excluded from the closest window');
    assert(simSrcs.indexOf('casa') === -1, 'prompt word itself is excluded');
  });

  group('pickConfusableDistractors 短词按词频取邻居', function () {
    var shortPrompt = { italian: 'e', english: 'and', rank: 1 };
    var shortPool = [
      shortPrompt,
      { italian: 'di', english: 'of', rank: 2 },
      { italian: 'ed', english: 'as well as', rank: 3 },
      { italian: 'la', english: 'the', rank: 4 },
      { italian: 'è', english: 'is', rank: 200 }
    ];
    var shortPicked = WordSimilarity.pickConfusableDistractors(shortPrompt, shortPool,
      { count: 3, windowSize: 3, sourceField: 'italian', targetField: 'english', correctTarget: 'and' });
    var shortSrcs = shortPicked.map(function (w) { return w.italian; });
    assertEqual(shortPicked.length, 3, 'short prompt still yields 3 distractors');
    assert(shortSrcs.indexOf('è') === -1, 'short prompt ranks by frequency, excluding far-rank edit-close decoy');
  });

  group('pickConfusableDistractors 释义去重', function () {
    var dupPrompt = { italian: 'mela', english: 'apple', rank: 10 };
    var dupPool = [
      dupPrompt,
      { italian: 'mona', english: 'X', rank: 11 },
      { italian: 'mola', english: 'Y', rank: 12 },
      { italian: 'mara', english: 'Z', rank: 13 },
      { italian: 'meta', english: 'apple', rank: 14 }
    ];
    var dupPicked = WordSimilarity.pickConfusableDistractors(dupPrompt, dupPool,
      { count: 3, sourceField: 'italian', targetField: 'english', correctTarget: 'apple' });
    var dupTgts = dupPicked.map(function (w) { return w.english; });
    var dupUnique = [];
    dupTgts.forEach(function (t) { if (dupUnique.indexOf(t) === -1) dupUnique.push(t); });
    assertEqual(dupUnique.length, dupTgts.length, 'distractor target texts are unique');
    assert(dupTgts.indexOf('apple') === -1, 'distractors never equal the correct answer text');
  });

  // ===== 回归：干扰项不能与正确答案同义 =====
  // 见 audit: it-mc-distractors-synonymous-with-answer
  // 线上截图：提示 "cercare"，选项是 search / Lost / Stop / "search; look for"
  // —— cerca("search") 与正确答案 "search; look for" 是同一个意思，题目无解。
  group('回归 cercare：同义词不能当干扰项', function () {
    var cercare = { italian: 'cercare', english: 'search; look for', rank: 100 };
    var cercarePool = [
      cercare,
      { italian: 'cerca', english: 'search', rank: 101 },
      { italian: 'cercano', english: 'they search', rank: 102 },
      { italian: 'cantare', english: 'to sing', rank: 103 },
      { italian: 'cenare', english: 'to have dinner', rank: 104 },
      { italian: 'creare', english: 'to create', rank: 105 },
      { italian: 'curare', english: 'to treat', rank: 106 },
      { italian: 'cedere', english: 'to yield', rank: 107 }
    ];
    var synonymHits = 0, shortRuns = 0;
    for (var run = 0; run < 20; run++) {
      var picked = WordSimilarity.pickConfusableDistractors(cercare, cercarePool, {
        count: 3, sourceField: 'italian', targetField: 'english', correctTarget: cercare.english
      });
      if (picked.length < 3) shortRuns++;
      picked.forEach(function (w) {
        if (w.italian === 'cerca' || w.italian === 'cercano') synonymHits++;
      });
    }
    assertEqual(synonymHits, 0, '20 次抽样里 cerca / cercano 从未被选为 "cercare" 的干扰项');
    assertEqual(shortRuns, 0, '剔除同义词后仍能凑满 3 个干扰项');

    // 同样的规则要作用在整条链路上，而不只是 WordSimilarity
    var cercareEngine = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: cercare },
      difficulty: 'hard'
    });
    var opts = cercareEngine.generateOptions(cercare.english, cercarePool);
    assertEqual(opts.length, 4, 'generateOptions 仍返回 4 个选项');
    var overlapping = opts.filter(function (o) {
      return o !== cercare.english && DimText.glossesOverlap(o, cercare.english);
    });
    assertEqual(overlapping.length, 0, 'hard 模式的选项里没有与正确答案同义的');

    // easy 模式走的是随机分支，同样不能出同义项
    var easyCercare = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: cercare },
      difficulty: 'easy'
    });
    var easyOverlap = 0;
    for (var e = 0; e < 20; e++) {
      easyCercare.generateOptions(cercare.english, cercarePool).forEach(function (o) {
        if (o !== cercare.english && DimText.glossesOverlap(o, cercare.english)) easyOverlap++;
      });
    }
    assertEqual(easyOverlap, 0, 'easy 模式的选项里也没有同义项');
  });

  // ===== 回归：占位释义不能出现在选项里 =====
  group('回归：占位释义不出题也不当选项', function () {
    var prompt = { italian: 'e', english: 'and', rank: 1 };
    var pool = [
      prompt,
      { italian: 'ed', english: 'and(2)', rank: 2 },       // 同义 + 占位残留
      { italian: 'ei', english: '(2)', rank: 3 },          // 纯占位
      { italian: 'di', english: 'of', rank: 4 },
      { italian: 'la', english: 'the', rank: 5 },
      { italian: 'in', english: 'in', rank: 6 },
      { italian: 'un', english: 'a', rank: 7 }
    ];
    var badHits = 0;
    for (var run = 0; run < 20; run++) {
      WordSimilarity.pickConfusableDistractors(prompt, pool, {
        count: 3, sourceField: 'italian', targetField: 'english', correctTarget: 'and'
      }).forEach(function (w) {
        if (w.italian === 'ed' || w.italian === 'ei') badHits++;
      });
    }
    assertEqual(badHits, 0, '"and(2)"（同义）和 "(2)"（纯占位）都不会被选为干扰项');

    var phEngine = makeEngine({ fieldMap: { source: 'italian', target: 'english' } });
    assert(!phEngine.isUsableWord({ italian: 'ei', english: '(2)' }), 'isUsableWord 拒绝纯占位释义的词条');
    assert(phEngine.isUsableWord({ italian: 'la', english: 'the (feminine); (2)' }), 'isUsableWord 接受有真义项的词条');
    var usable = phEngine.filterUsableWords(pool);
    assert(usable.indexOf(pool[2]) === -1, 'filterUsableWords 过滤掉纯占位词条');
    assertEqual(phEngine.filterUsableWords([{ italian: 'x', english: '(2)' }]).length, 1,
      'filterUsableWords 在全部不可用时退回原列表，不会让练习变成空');
  });

  // ===== 渲染：展示清洗过的释义，判分用原始字符串 =====
  group('renderOptions 展示 vs 判分', function () {
    var container = document.createElement('div');
    var renderEngine = makeEngine({ dom: { optionsContainer: container } });
    var raw = 'the (feminine); (2); (3)';
    renderEngine.renderOptions([raw, 'of', 'and', 'in'], function () {});
    var buttons = container.querySelectorAll('.option');
    assertEqual(buttons.length, 4, 'renderOptions 渲染 4 个按钮');
    var first = null;
    buttons.forEach(function (b) { if (b.dataset.answer === raw) first = b; });
    assert(first !== null, 'data-answer 保留原始释义（判分链路不变）');
    assertEqual(first ? first.textContent : '', 'the (feminine)', '按钮文字是清洗过的释义，用户看不到 (2)/(3)');

    // 自定义词书 / 导入数据里的敌意字符串必须转义
    var hostile = '<img src=x onerror="alert(1)">';
    renderEngine.renderOptions([hostile, 'a', 'b', 'c'], function () {});
    assert(container.innerHTML.indexOf('<img src=x') === -1, 'renderOptions 转义敌意释义，不会注入 <img>');
    assert(container.innerHTML.indexOf('&lt;img') !== -1, 'renderOptions 输出的是转义后的实体');
  });

  // ===== 判分：同义答案不判错 =====
  group('isAnswerCorrect', function () {
    var e = makeEngine();
    assert(e.isAnswerCorrect('you', 'you'), '完全相同当然算对');
    assert(e.isAnswerCorrect('search', 'search; look for'), '选中的义项是正确答案的子集 —— 算对');
    assert(e.isAnswerCorrect('to search', 'search'), '忽略不定式 to');
    assert(!e.isAnswerCorrect('thing', 'house'), '不同意思仍然判错');
    assert(!e.isAnswerCorrect(null, 'house'), 'null 不判对');
  });

  // ===== 掌握度：一次蒙对不算掌握 =====
  // 见 audit: it-mastered-after-one-lucky-guess
  group('MasteryPolicy 连续答对门槛', function () {
    var LANG = 'testlang';
    MasteryPolicy.clear(LANG);
    assertEqual(MasteryPolicy.STREAK_REQUIRED >= 2, true, '掌握门槛至少要连对 2 次');

    var first = MasteryPolicy.record(LANG, 'ciao', true, {});
    assertEqual(first.streak, 1, '第一次答对 streak = 1');
    assertEqual(first.mastered, false, '四选一蒙对一次不算掌握');
    var second = MasteryPolicy.record(LANG, 'ciao', true, {});
    assertEqual(second.streak, 2, '第二次答对 streak = 2');
    assertEqual(second.mastered, true, '连对 2 次才算掌握');
    var wrong = MasteryPolicy.record(LANG, 'ciao', false, {});
    assertEqual(wrong.streak, 0, '答错后 streak 归零');
    assertEqual(wrong.mastered, false, '答错不算掌握');
    MasteryPolicy.clear(LANG);

    // SM-2 已经把词排到长间隔时直接认定掌握
    var savedSR = window.SpacedRepetition;
    window.SpacedRepetition = { name: 'stub' };
    var srWord = { italian: 'grazie', srData: { repetitions: 4, interval: 30 } };
    var srResult = MasteryPolicy.record(LANG, 'grazie', true, { word: srWord });
    assertEqual(srResult.mastered, true, 'SM-2 已排到长间隔的词，一次答对即算掌握');
    window.SpacedRepetition = savedSR;
    MasteryPolicy.clear(LANG);
  });

  // ===== MasteryPolicy.record 的完整契约 =====
  // 三个语言 lane 正在按 window.MasteryPolicy.record(lang, key, isCorrect, {word}) 写代码，
  // 这里把 streak 生命周期、幂等性、存储不可用时的降级都钉死。
  group('MasteryPolicy.record 契约：streak 生命周期', function () {
    var LANG = 'contractlang';
    var N = MasteryPolicy.STREAK_REQUIRED;
    assert(N >= 2, 'STREAK_REQUIRED >= 2（一次蒙对绝不能算掌握）');

    // N-1 次答对都不算掌握
    MasteryPolicy.clear(LANG);
    for (var i = 1; i < N; i++) {
      var r = MasteryPolicy.record(LANG, 'w', true, {});
      assertEqual(r.streak, i, '第 ' + i + ' 次答对 streak = ' + i);
      assertEqual(r.mastered, false, '连对 ' + i + ' 次（< ' + N + '）不算掌握');
      assertEqual(MasteryPolicy.getStreak(LANG, 'w'), i, 'streak 被持久化：' + i);
    }
    // 第 N 次才算
    var nth = MasteryPolicy.record(LANG, 'w', true, {});
    assertEqual(nth.streak, N, '第 ' + N + ' 次答对 streak = ' + N);
    assertEqual(nth.mastered, true, '连对 ' + N + ' 次才算掌握');
    assertEqual(MasteryPolicy.getStreak(LANG, 'w'), 0, '掌握后 streak 条目从存储里清掉');

    // 在 N-1 处答错 -> 归零
    MasteryPolicy.clear(LANG);
    for (var j = 1; j < N; j++) MasteryPolicy.record(LANG, 'x', true, {});
    assertEqual(MasteryPolicy.getStreak(LANG, 'x'), N - 1, '答错前 streak = ' + (N - 1));
    var wrong = MasteryPolicy.record(LANG, 'x', false, {});
    assertEqual(wrong.streak, 0, '在门槛前一步答错，streak 归零');
    assertEqual(wrong.mastered, false, '答错不算掌握');
    assertEqual(MasteryPolicy.getStreak(LANG, 'x'), 0, '归零后存储里也不再有该词条');
    // 归零后要重新从 1 数起
    assertEqual(MasteryPolicy.record(LANG, 'x', true, {}).streak, 1, '答错后重新从 streak = 1 开始');
    assertEqual(MasteryPolicy.record(LANG, 'x', true, {}).mastered, N === 2,
      '重新连对 ' + N + ' 次才再次掌握');

    // 分语言隔离
    MasteryPolicy.clear(LANG);
    MasteryPolicy.clear(LANG + '2');
    MasteryPolicy.record(LANG, 'shared', true, {});
    assertEqual(MasteryPolicy.getStreak(LANG + '2', 'shared'), 0, 'streak 按语言隔离存储');
    MasteryPolicy.clear(LANG);
    MasteryPolicy.clear(LANG + '2');
  });

  group('MasteryPolicy.record 契约：幂等 / 健壮性', function () {
    var LANG = 'contractlang';
    MasteryPolicy.clear(LANG);

    // 已掌握的词再答对，仍然返回 mastered（不会"退回未掌握"）
    for (var i = 0; i < MasteryPolicy.STREAK_REQUIRED; i++) MasteryPolicy.record(LANG, 'w', true, {});
    var again = MasteryPolicy.record(LANG, 'w', true, { mastered: true });
    assertEqual(again.mastered, true, '已掌握的词再答对一次仍然是掌握（幂等）');
    var again2 = MasteryPolicy.record(LANG, 'w', true, { mastered: true });
    assertEqual(again2.mastered, true, '连续重复调用结果稳定');
    assertEqual(MasteryPolicy.getStreak(LANG, 'w'), 0, '掌握态下不会往存储里堆 streak');

    // 连续答错是幂等的
    assertEqual(MasteryPolicy.record(LANG, 'w', false, {}).streak, 0, '答错 streak = 0');
    assertEqual(MasteryPolicy.record(LANG, 'w', false, {}).streak, 0, '再答错还是 0，不会变成负数');

    // 空 key 不写存储、不抛错
    MasteryPolicy.clear(LANG);
    [null, undefined, ''].forEach(function (bad) {
      var r = MasteryPolicy.record(LANG, bad, true, {});
      assertEqual(r.streak, 0, 'key=' + JSON.stringify(bad) + ' 时 streak = 0');
      assertEqual(r.mastered, false, 'key=' + JSON.stringify(bad) + ' 时不算掌握');
    });
    assertEqual(localStorage.getItem(MasteryPolicy.storageKey(LANG)), null, '空 key 不会写出存储条目');
    assertEqual(MasteryPolicy.getStreak(LANG, null), 0, 'getStreak 处理空 key');

    // 存储被写坏（字符串 / 数组 / 非数字 streak）时不能抛
    MasteryPolicy.clear(LANG);
    ['"nonsense"', '[1,2,3]', 'null', '{"w":"abc"}', '{"w":-5}', 'not json at all'].forEach(function (junk) {
      localStorage.setItem(MasteryPolicy.storageKey(LANG), junk);
      var r = MasteryPolicy.record(LANG, 'w', true, {});
      assertEqual(r.streak, 1, '存储内容为 ' + junk + ' 时安全地从 streak = 1 重新开始');
    });
    MasteryPolicy.clear(LANG);

    // localStorage 完全不可用时：不抛错，且同一会话内 streak 仍然成立
    var origDesc = Object.getOwnPropertyDescriptor(window, 'localStorage');
    var stubbed = false;
    try {
      Object.defineProperty(window, 'localStorage', {
        configurable: true,
        get: function () { throw new Error('storage denied'); }
      });
      stubbed = true;
    } catch (e) {}
    assert(stubbed, '能临时禁用 localStorage 以验证降级路径');
    if (stubbed) {
      var noLsErr = null, noLs1 = null, noLs2 = null;
      try {
        noLs1 = MasteryPolicy.record('nols', 'w', true, {});
        noLs2 = MasteryPolicy.record('nols', 'w', true, {});
        MasteryPolicy.getStreak('nols', 'w');
        MasteryPolicy.clear('nols');
      } catch (e) { noLsErr = e; }
      if (origDesc) Object.defineProperty(window, 'localStorage', origDesc);
      else delete window.localStorage;
      assertEqual(noLsErr, null, 'localStorage 不可用时 record/getStreak/clear 都不抛错');
      assertEqual(noLs1 && noLs1.streak, 1, 'localStorage 不可用时第一次答对 streak = 1');
      assertEqual(noLs2 && noLs2.streak, 2, 'localStorage 不可用时仍能累计 streak（会话内兜底）');
      assertEqual(noLs2 && noLs2.mastered, MasteryPolicy.STREAK_REQUIRED <= 2,
        'localStorage 不可用时掌握判定仍然按门槛走');
    }
    assertEqual(typeof localStorage.getItem, 'function', 'localStorage 已恢复');
    MasteryPolicy.clear(LANG);
  });

  group('recordAnswer 维护 mastered 集合', function () {
    var LANG = 'testlang';
    MasteryPolicy.clear(LANG);
    var mastered = new Set();
    var e = makeEngine({ language: LANG, mastered: mastered });
    var word = { italian: 'ciao', english: 'hello' };

    var r1 = e.recordAnswer(word, true);
    assertEqual(mastered.has('ciao'), false, '首次答对不进入已掌握集合');
    assertEqual(r1.streak, 1, 'recordAnswer 回传 streak');
    var r2 = e.recordAnswer(word, true);
    assertEqual(mastered.has('ciao'), true, '连对 2 次后进入已掌握集合');
    assertEqual(r2.mastered, true, 'recordAnswer 回传 mastered');
    var r3 = e.recordAnswer(word, false);
    assertEqual(mastered.has('ciao'), false, '之后答错会退出已掌握集合（进度条会回落）');
    assertEqual(r3.demoted, true, 'recordAnswer 回传 demoted');
    MasteryPolicy.clear(LANG);
  });

  // ===== 难度：分语言可用，不再只有意大利语有开关 =====
  // 见 audit: difficulty-toggle-ui-italian-only
  group('难度偏好 API', function () {
    var KEYS = ['dimenticato_quiz_difficulty'];
    QuizEngine.LANGUAGES.forEach(function (l) { KEYS.push(QuizEngine.difficultyKeyFor(l)); });
    KEYS.forEach(function (k) { localStorage.removeItem(k); });

    assertEqual(typeof QuizEngine.getDifficulty, 'function', 'QuizEngine.getDifficulty exists');
    assertEqual(QuizEngine.getDifficulty(), 'hard', 'difficulty defaults to hard when unset');
    assert(QuizEngine.LANGUAGES.indexOf('german') !== -1 && QuizEngine.LANGUAGES.indexOf('french') !== -1,
      '难度 API 覆盖德语和法语，不只是意大利语');

    QuizEngine.setDifficulty('easy', 'german');
    assertEqual(QuizEngine.getDifficulty('german'), 'easy', '分语言设置：德语改成简单');
    assertEqual(QuizEngine.getDifficulty('italian'), 'hard', '分语言设置不影响其它语言');
    assertEqual(QuizEngine.getDifficulty(), 'hard', '分语言设置不改全局默认');

    QuizEngine.setDifficulty('easy');
    assertEqual(QuizEngine.getDifficulty(), 'easy', '全局设置生效');
    assertEqual(QuizEngine.getDifficulty('german'), 'easy', '全局设置会清掉分语言覆盖');
    QuizEngine.setDifficulty('hard');

    // 引擎实例：分语言设置 > 显式字面量配置 > 全局
    QuizEngine.setDifficulty('easy', 'french');
    var frEngine = makeEngine({ language: 'french', fieldMap: { source: 'french', target: 'meaning' } });
    assertEqual(frEngine.getDifficulty(), 'easy', '引擎按自己的语言读难度');
    var forcedWhileScoped = makeEngine({ language: 'french', difficulty: 'hard' });
    assertEqual(forcedWhileScoped.getDifficulty(), 'easy',
      '分语言设置压过显式 difficulty 配置 —— 用户点过的开关最大');

    // 没有分语言设置时，显式字面量才压过全局
    localStorage.removeItem(QuizEngine.difficultyKeyFor('french'));
    QuizEngine.setDifficulty('easy');
    var forced = makeEngine({ language: 'french', difficulty: 'hard' });
    assertEqual(forced.getDifficulty(), 'hard',
      '没有分语言设置时，显式 difficulty 字面量压过全局设置');
    KEYS.forEach(function (k) { localStorage.removeItem(k); });
  });

  // ===== 回归：分语言开关必须真的影响出题，而不只是亮一下 =====
  // 见 review: per-language-difficulty-toggles-are-inert
  // 四个 App 传给 QuizEngine 的都是这行（german-app.js:288 / app.js:1401 /
  // german-app.js:1637 / french-app.js:1180）：
  //     get difficulty() { return QuizEngine.getDifficulty(); }
  // 这个 getter 永远返回 'easy'|'hard'。如果它优先于分语言设置，
  // 用户在德语设置页点"简单"就永远不生效 —— 控件亮着却在骗人。
  group('回归：分语言难度真的作用到引擎（App 的 getter 不能压过它）', function () {
    var KEYS = ['dimenticato_quiz_difficulty'];
    QuizEngine.LANGUAGES.forEach(function (l) { KEYS.push(QuizEngine.difficultyKeyFor(l)); });
    KEYS.forEach(function (k) { localStorage.removeItem(k); });

    // 逐字复制各 App 的配置写法（difficulty 必须是 getter，不能先取值再赋值）
    function appStyleEngine(lang, source, currentWord) {
      return new QuizEngine({
        state: {
          words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0,
          currentWord: currentWord || null
        },
        stats: {},
        mastered: new Set(),
        fieldMap: { source: source, target: 'meaning' },
        language: lang,
        get difficulty() { return QuizEngine.getDifficulty(); },
        saveFn: function () {},
        onUpdateStats: function () {},
        dom: {}
      });
    }
    assert(!('value' in Object.getOwnPropertyDescriptor(appStyleEngine('german', 'german').config, 'difficulty')),
      '测试夹具确实保留了 App 的 difficulty getter（不是被求值成字面量）');

    var germanEngine = appStyleEngine('german', 'german');
    assertEqual(germanEngine.getDifficulty(), 'hard', '没设置过时德语引擎用全局默认 hard');

    localStorage.setItem('dimenticato_quiz_difficulty_german', 'easy');
    assertEqual(QuizEngine.getDifficulty('german'), 'easy', '分语言设置已写入');
    assertEqual(germanEngine.getDifficulty(), 'easy',
      '存了 dimenticato_quiz_difficulty_german=easy 后，GermanApp 风格的引擎返回 easy');
    assertEqual(appStyleEngine('italian', 'italian').getDifficulty(), 'hard',
      '德语的分语言设置不影响意大利语引擎');

    // 生成的选项也必须走 easy 分支（hard 分支才会用 WordSimilarity 挑形近词）
    var pool = [
      { german: 'Haus', meaning: '房子' }, { german: 'Maus', meaning: '老鼠' },
      { german: 'Laus', meaning: '虱子' }, { german: 'Baum', meaning: '树' },
      { german: 'Tisch', meaning: '桌子' }, { german: 'Stuhl', meaning: '椅子' }
    ];
    var easyEngineDe = appStyleEngine('german', 'german', pool[0]);
    var savedPick = WordSimilarity.pickConfusableDistractors;
    var hardBranchHits = 0;
    WordSimilarity.pickConfusableDistractors = function () { hardBranchHits++; return savedPick.apply(this, arguments); };
    easyEngineDe.generateOptions('房子', pool);
    WordSimilarity.pickConfusableDistractors = savedPick;
    assertEqual(hardBranchHits, 0, 'easy 时不再走 hard 的形近干扰项分支');

    // 法语 / 英语同理
    localStorage.setItem('dimenticato_quiz_difficulty_french', 'easy');
    assertEqual(appStyleEngine('french', 'french').getDifficulty(), 'easy',
      '法语分语言设置作用到 FrenchApp 风格的引擎');
    localStorage.setItem('dimenticato_quiz_difficulty_english', 'hard');
    localStorage.setItem('dimenticato_quiz_difficulty', 'easy');   // 全局改成简单
    assertEqual(appStyleEngine('english', 'english').getDifficulty(), 'hard',
      '英语分语言设置压过全局设置');
    assertEqual(appStyleEngine('italian', 'italian').getDifficulty(), 'easy',
      '没有分语言覆盖的语言仍然跟随全局设置');

    KEYS.forEach(function (k) { localStorage.removeItem(k); });
  });

  group('难度控件可注入 + 事件委托', function () {
    localStorage.removeItem(QuizEngine.difficultyKeyFor('german'));
    var markup = QuizEngine.renderDifficultyToggle('german', '选择题难度');
    assert(markup.indexOf('data-difficulty-lang="german"') !== -1, '控件带语言作用域');
    assert(markup.indexOf('data-difficulty="easy"') !== -1 && markup.indexOf('data-difficulty="hard"') !== -1,
      '控件有简单/困难两个选项');
    assert(markup.indexOf('class="segmented difficulty-toggle"') !== -1, '复用现有 segmented 组件类，不新增样式');

    var host = document.createElement('div');
    host.innerHTML = markup;
    document.body.appendChild(host);
    QuizEngine.bindDifficultyToggles();
    QuizEngine.syncDifficultyToggles(host);

    var easyBtn = host.querySelector('[data-difficulty=easy]');
    assert(!!easyBtn, '注入的控件能被查询到');
    if (easyBtn) {
      easyBtn.click();
      assertEqual(QuizEngine.getDifficulty('german'), 'easy', '点击运行时注入的控件即可改德语难度');
      assert(easyBtn.classList.contains('active'), '点击后选中态同步');
    }
    host.remove();
    localStorage.removeItem(QuizEngine.difficultyKeyFor('german'));
  });

  // 见 audit: difficulty-toggle-ui-italian-only —— 开关以前只有意大利语设置页有
  group('难度控件自动挂载到德/英/法页面', function () {
    var screens = document.createElement('div');
    screens.innerHTML =
      '<section id="germanSettingsScreen" class="screen"><div class="container"></div></section>' +
      '<section id="englishSettingsScreen" class="screen"><div class="container"></div></section>' +
      '<section id="frenchVocabularyModesScreen" class="screen"><div class="container"></div></section>';
    document.body.appendChild(screens);

    var mounted = QuizEngine.mountDifficultyToggles();
    assertEqual(mounted, 3, '德语/英语/法语各挂上一个难度控件');
    ['german', 'english', 'french'].forEach(function (lang) {
      assert(!!screens.querySelector('[data-difficulty-lang=' + lang + ']'), lang + ' 页面上出现了难度控件');
    });
    assertEqual(QuizEngine.mountDifficultyToggles(), 0, '重复调用不会重复注入');

    var frenchEasy = screens.querySelector('[data-difficulty-lang=french]').querySelector('[data-difficulty=easy]');
    frenchEasy.click();
    assertEqual(QuizEngine.getDifficulty('french'), 'easy', '法语页面上的控件真的能改法语难度');
    assertEqual(QuizEngine.getDifficulty('german'), 'hard', '改法语不影响德语');

    screens.remove();
    QuizEngine.LANGUAGES.forEach(function (l) { localStorage.removeItem(QuizEngine.difficultyKeyFor(l)); });
  });

  // ===== hard / easy 两条分支都能凑满 4 个选项 =====
  group('hard / easy 选项生成', function () {
    var hardEngine = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: simPrompt },
      difficulty: 'hard'
    });
    var hardOptions = hardEngine.generateOptions('house', simPool);
    assertEqual(hardOptions.length, 4, 'hard-mode generateOptions returns 4 options');
    assert(hardOptions.indexOf('house') !== -1, 'hard-mode options include the correct answer');
    var hardUnique = [];
    hardOptions.forEach(function (o) { if (hardUnique.indexOf(o) === -1) hardUnique.push(o); });
    assertEqual(hardUnique.length, hardOptions.length, 'hard-mode options have no duplicates');

    var easyEngine = makeEngine({
      state: { words: [], quizIndex: 0, quizCorrect: 0, quizTotal: 0, currentWord: simPrompt },
      difficulty: 'easy'
    });
    var easyOptions = easyEngine.generateOptions('house', simPool);
    assertEqual(easyOptions.length, 4, 'easy-mode generateOptions returns 4 options');
    assert(easyOptions.indexOf('house') !== -1, 'easy-mode options include the correct answer');
  });

  // ===== 性能：hard 模式不能对整个词库做全表扫描 =====
  // 见 audit(missed): 24k 词库上旧实现约 145 ms/题
  group('hard 模式性能', function () {
    var big = [];
    for (var i = 0; i < 8000; i++) {
      big.push({ italian: 'w' + i.toString(36), english: 'gloss ' + i, rank: i });
    }
    WordSimilarity._resetIndexCache();
    var start = Date.now();
    for (var q = 0; q < 100; q++) {
      var promptWord = big[(q * 79) % big.length];
      WordSimilarity.pickConfusableDistractors(promptWord, big, {
        count: 3, sourceField: 'italian', targetField: 'english', correctTarget: promptWord.english
      });
    }
    var elapsed = Date.now() - start;
    assert(elapsed < 3000, '8000 词池出 100 道题应远快于全表扫描（实测 ' + elapsed + ' ms）');
  });

  // --- Summary ---
  var summary = document.createElement('div');
  summary.className = 'summary';
  summary.textContent = passed + ' passed, ' + failed + ' failed' + (known ? ', ' + known + ' known issues' : '');
  summary.style.color = failed === 0 ? '#2ecc71' : '#e74c3c';
  results.insertBefore(summary, results.firstChild);
})();
